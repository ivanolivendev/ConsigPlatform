services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consigplatform}
      POSTGRES_USER: ${POSTGRES_USER:-consigplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consigplatform_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-consigplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-consigplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-consigplatform_local}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
