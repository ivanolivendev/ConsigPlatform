spring:
  application:
    name: consig-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consigplatform}
    username: ${SPRING_DATASOURCE_USERNAME:consigplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:consigplatform_local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
